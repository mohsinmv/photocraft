# Builds the self-hosted web image off the production server and publishes it for Coolify to pull.
# Lives on the `deploy` branch only, so `main` stays a clean fast-forward of upstream.
name: Build web image

on:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-web-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mohsinmv/photocraft-web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA::12}" -t "$IMAGE:latest" \
            --label org.opencontainers.image.source=https://github.com/mohsinmv/photocraft \
            --build-arg CARGO_BUILD_JOBS=4 \
            --build-arg PHOTOCRAFT_BUILD_SHA="$GITHUB_SHA" \
            --build-arg PHOTOCRAFT_BUILD_DATE="$(date -u +%F)" \
            .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8080 "$IMAGE:latest"
          for _ in $(seq 1 15); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
          docker rm -f smoke

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"
